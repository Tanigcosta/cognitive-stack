[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-architecture"
version = "0.1.0"
description = "A starter kit for reusable prompt architecture, stacks, and pipelines."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenAI - generated starter kit" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
